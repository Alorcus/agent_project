[project]
name = "agentchat"
version = "0.1.0"
description = "Terminal chat client for the Intelligent Agents course project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0",
    # Local inference against the cluster's checkpoints. Pinned below 5.0
    # because `torch_dtype=` is removed there in favour of `dtype=`, and a
    # silently-ignored dtype means a bf16 model loading as fp32.
    "torch>=2.4",
    "transformers>=4.51,<5",
    "accelerate>=1.0",
    "python-dotenv>=1.0",
    # Arrives with torch today, but retrieval.py and storage/sqlite.py import
    # it directly — an undeclared import is one `uv sync` from being wrong.
    "numpy>=1.26",
    # PDF text extraction. Pure Python: no system libraries to install on the
    # cluster, and nothing fetched at read time.
    "pypdf>=5.0",
]

[project.scripts]
agentchat = "agentchat.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "textual-dev>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentchat"]

[tool.uv]
# Build the environment on uv's own CPython, never the system one. Triton JIT-
# compiles a CUDA helper on the first forward pass and needs Python.h to do it;
# the cluster's system python3.12 ships without dev headers, so a venv built on
# it loads the weights fine and then fails on the first token.
python-preference = "only-managed"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

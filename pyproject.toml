[project]
name = "agentchat"
version = "0.1.0"
description = "Terminal chat client for the Intelligent Agents course project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0",
]

[project.scripts]
agentchat = "agentchat.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "textual-dev>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentchat"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
